; double-ESP-resso AP node: Seeed XIAO ESP32-C5 stacked on the RF node.
; ESP32-C5 needs Arduino core 3.3+ (Tasmota platform build 2026.05.50 ships 3.3.8).
[env:XIAO_C5]
framework = arduino
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.05.50/platform-espressif32.zip
board = seeed_xiao_esp32c5
board_build.filesystem = littlefs
; The C5 Arduino core mounts LittleFS disk version 2.0 only
; (CONFIG_LITTLEFS_DISK_VERSION_2_0); the platform default 2.1 fails to mount.
board_build.littlefs_version = 2.0
board_build.partitions = default_8MB.csv
upload_speed = 921600
monitor_speed = 460800
board_build.f_cpu = 240000000L
lib_compat_mode = strict
lib_deps =
    ESP32Async/AsyncTCP @ ^3.4.7
    ESP32Async/ESPAsyncWebServer @ ^3.8.1
    bblanchon/ArduinoJson @7.2.0
    ayushsharma82/ElegantOTA @^3.1.7
    adafruit/Adafruit NeoPixel @ ^1.12.5
build_flags =
    -DC5VRX_LINK=1
    -I../common
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
